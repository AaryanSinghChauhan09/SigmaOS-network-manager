[package]
name = "sigmaos_network_manager"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "SigmaOS Network Manager — declarative network interface and routing configuration"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sigma-net"
path = "src/main.rs"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
